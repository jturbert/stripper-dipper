name: Generate Text Only

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Manufacturer product page URL (leave blank if using a PDF)"
        required: false
        type: string
      pdf_path:
        description: "Path to PDF in repo, e.g. pdfs/bathys.pdf (leave blank if using a URL)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies + Chromium
        run: playwright install --with-deps chromium

      - name: Generate text
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCT_URL: ${{ inputs.url }}
          PDF_PATH: ${{ inputs.pdf_path }}
        run: python text_only.py

      - name: Read product slug
        id: slug
        run: echo "name=$(cat product_slug.txt)" >> $GITHUB_OUTPUT

      - name: Upload listing as artifact
        uses: actions/upload-artifact@v4
        with:
          name: text-${{ steps.slug.outputs.name }}
          path: output/
          retention-days: 90
          if-no-files-found: warn
