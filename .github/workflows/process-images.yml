name: Process Images Only

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Manufacturer product page URL"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.cache/huggingface
          key: rembg-birefnet-v1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies + Chromium
        run: playwright install --with-deps chromium

      - name: Process images
        env:
          PRODUCT_URL: ${{ inputs.url }}
        run: python images_only.py

      - name: Read product slug
        id: slug
        run: echo "name=$(cat product_slug.txt)" >> $GITHUB_OUTPUT

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ steps.slug.outputs.name }}
          path: output/
          retention-days: 90
          if-no-files-found: warn
